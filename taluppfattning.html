<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taluppfattning – MatteResan</title>
<style>
:root{
  --bg:#f4efe4;
  --paper:#fffdf8;
  --green:#1f4b36;
  --green2:#e3ede5;
  --text:#173629;
  --muted:#6d786f;
  --line:#d8dfd7;
  --gold:#f2e6b9;
  --ok:#dff1e4;
  --bad:#f6dddd;
  --shadow:0 10px 28px rgba(38,55,43,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1160px;margin:auto;padding:24px}
header{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:26px;
  padding:26px;
  box-shadow:var(--shadow);
}
.top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap
}
h1{margin:4px 0 5px;font-size:clamp(32px,5vw,52px)}
.subtitle{color:var(--muted);font-size:17px}
.btn{
  border:0;border-radius:14px;padding:11px 16px;font-weight:800;
  background:var(--green);color:white
}
.btn.secondary{background:var(--green2);color:var(--green);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.badge{
  display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--green2);
  font-size:13px;font-weight:800
}
.progress-wrap{margin-top:18px}
.progress{
  height:12px;background:#e8ece7;border-radius:999px;overflow:hidden
}
.progress i{display:block;height:100%;background:var(--green);width:0}
.progress-text{font-size:13px;color:var(--muted);margin-top:5px}
.notice{
  margin:16px 0;background:var(--gold);border:1px solid #dfcd8c;border-radius:16px;
  padding:13px 15px;color:#63531e
}
.sections{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:18px
}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:var(--shadow)
}
.card.locked{opacity:.52}
.card h2{font-size:22px;margin:10px 0 6px}
.card p{margin:0;color:var(--muted);line-height:1.45}
.meta{font-size:13px;color:var(--muted);margin-top:8px}
.work{
  display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)
}
.work.show{display:block}
.example{
  background:#f7f3ea;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0
}
.q{
  background:#f8f5ed;border:1px solid #e8e2d6;border-radius:14px;padding:13px;margin:11px 0
}
.q strong{display:block;margin-bottom:8px}
.answer{display:grid;grid-template-columns:1fr auto;gap:8px}
.answer input{
  width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:white
}
.feedback{font-size:14px;font-weight:800;margin-top:7px}
.ok{color:#21643b}.no{color:#9b3636}
textarea{
  width:100%;min-height:110px;padding:11px;border:1px solid var(--line);border-radius:12px;background:white
}
.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:780px){.sections{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div>
      <span class="badge">MatteResan · Kapitel 1</span>
      <h1>Taluppfattning</h1>
      <div class="subtitle">Positionssystem · utvecklad form · jämföra tal · avrundning · negativa tal</div>
    </div>
    <div class="footer-actions">
      <button class="btn secondary" onclick="location.href='index.html'">← Till MatteResan</button>
      <button class="btn ghost" onclick="resetChapter()">Nollställ kapitlet</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress"><i id="bar"></i></div>
    <div class="progress-text" id="progressText">0 % klart</div>
  </div>
</header>

<div class="notice">
  Gör delarna i ordning. Nästa del öppnas först när föregående del är klar.
</div>

<section class="sections" id="sections"></section>
</div>

<script>
const STORE="matterson-taluppfattning-v1";

const parts=[
 {key:"position",title:"1. Positionssystem",desc:"Förstå ental, tiotal, hundratal, tusental och större tal.",kind:"quiz"},
 {key:"expanded",title:"2. Utvecklad form",desc:"Dela upp tal efter siffrornas platsvärde.",kind:"quiz"},
 {key:"compare",title:"3. Jämföra och ordna tal",desc:"Bestäm vilket tal som är störst, minst och placera tal i ordning.",kind:"quiz"},
 {key:"round",title:"4. Avrundning",desc:"Avrunda till närmaste tiotal, hundratal och tusental.",kind:"quiz"},
 {key:"negative",title:"5. Negativa tal",desc:"Träna på tallinjen, temperatur och tal under noll.",kind:"quiz"},
 {key:"reason",title:"6. Resonera",desc:"Förklara hur du tänker med matematiska begrepp.",kind:"text"},
 {key:"problem",title:"7. Problemlösning",desc:"Använd taluppfattning i två större problem.",kind:"text"},
 {key:"check",title:"8. Kapitelkoll",desc:"15 blandade uppgifter. Minst 80 % rätt krävs.",kind:"check"}
];

let state;
try{
  state=JSON.parse(localStorage.getItem(STORE))||{done:{},scores:{}};
}catch(e){state={done:{},scores:{}}}
state.done=state.done||{};
state.scores=state.scores||{};

function save(){
  localStorage.setItem(STORE,JSON.stringify(state));
  render();
  syncMainProgress();
}
function syncMainProgress(){
  try{
    const mainKey="matterson-start-v1";
    let s=JSON.parse(localStorage.getItem(mainKey)||'{"open":{"1":true},"progress":{}}');
    s.progress=s.progress||{};
    s.progress[1]=Math.round(Object.keys(state.done).filter(k=>state.done[k]).length/parts.length*100);
    localStorage.setItem(mainKey,JSON.stringify(s));
  }catch(e){}
}
function isUnlocked(index){
  if(index===0)return true;
  return !!state.done[parts[index-1].key];
}
function progress(){
  return Math.round(parts.filter(p=>state.done[p.key]).length/parts.length*100);
}
function render(){
  const p=progress();
  bar.style.width=p+"%";
  progressText.textContent=p+" % klart";
  sections.innerHTML=parts.map((part,i)=>{
    const unlocked=isUnlocked(i), done=!!state.done[part.key];
    const score=state.scores[part.key];
    return `<article class="card ${unlocked?"":"locked"}">
      <span class="badge">${done?"✓ Klar":unlocked?"Öppen":"🔒 Låst"}</span>
      <h2>${part.title}</h2>
      <p>${part.desc}</p>
      <div class="meta">${score!==undefined?`Senaste resultat: ${score} %`:""}</div>
      <div style="margin-top:12px">
        ${unlocked?`<button class="btn ${done?"secondary":""}" onclick="openPart('${part.key}')">${done?"Träna igen":"Starta"}</button>`:`<span class="meta">Gör föregående del först.</span>`}
      </div>
      <div class="work" id="work-${part.key}"></div>
    </article>`;
  }).join("");
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)]}
function sv(n){return Number(n).toLocaleString("sv-SE")}
function norm(x){return String(x).trim().toLowerCase().replace(/\s+/g,"").replace(".",",")}

function questionPosition(){
  const n=rand(1000,99999);
  const places=[1,10,100,1000,10000];
  let pow=choice(places);
  let digit=Math.floor(n/pow)%10;
  if(digit===0){digit=choice([1,2,3,4,5,6,7,8,9]); n += digit*pow}
  return [`Vilket värde har siffran ${digit} i talet ${sv(n)}?`,String(digit*pow)]
}
function questionExpanded(){
  const tt=rand(1,9)*10000, t=rand(0,9)*1000, h=rand(0,9)*100, ti=rand(0,9)*10, e=rand(0,9);
  const n=tt+t+h+ti+e;
  return [`Skriv ${sv(tt)} + ${sv(t)} + ${h} + ${ti} + ${e} som ett tal.`,String(n)]
}
function questionCompare(){
  const a=rand(1000,99999),b=a+rand(1,3000);
  const type=rand(1,2);
  return type===1
    ? [`Vilket tal är störst: ${sv(a)} eller ${sv(b)}?`,String(b)]
    : [`Vilket tal är minst: ${sv(a)} eller ${sv(b)}?`,String(a)]
}
function questionRound(){
  const n=rand(1000,99999);
  const place=choice([10,100,1000]);
  const label=place===10?"tiotal":place===100?"hundratal":"tusental";
  const ans=Math.round(n/place)*place;
  return [`Avrunda ${sv(n)} till närmaste ${label}.`,String(ans)]
}
function questionNegative(){
  const type=rand(1,3);
  if(type===1){
    const n=rand(-15,10);
    return [`Vilket tal kommer direkt efter ${n}?`,String(n+1)]
  }
  if(type===2){
    const a=rand(-15,5),b=a+rand(1,10);
    return [`Vilket tal är störst: ${a} eller ${b}?`,String(b)]
  }
  const start=rand(-10,0),rise=rand(1,12);
  return [`Temperaturen är ${start} °C och stiger ${rise} grader. Vilken temperatur blir det?`,String(start+rise)]
}
function mixedQuestion(){
  return choice([questionPosition,questionExpanded,questionCompare,questionRound,questionNegative])()
}

let current={};

function openPart(key){
  const el=document.getElementById("work-"+key);
  el.classList.add("show");

  if(key==="reason"){
    el.innerHTML=`
      <div class="q"><strong>1. Förklara</strong>
      <p>Vad är skillnaden mellan siffran 6 och värdet 6 000 i ett tal?</p>
      <textarea id="r1" placeholder="Skriv hur du tänker..."></textarea></div>
      <div class="q"><strong>2. Förklara</strong>
      <p>Hur kan du avgöra vilket av två femsiffriga tal som är störst?</p>
      <textarea id="r2" placeholder="Använd gärna ord som tiotusental, tusental och platsvärde."></textarea></div>
      <button class="btn" onclick="finishText('reason',['r1','r2'])">Spara mina svar</button>
      <div id="msg-reason" class="feedback"></div>`;
    return;
  }

  if(key==="problem"){
    el.innerHTML=`
      <div class="q"><strong>Problem 1</strong>
      <p>Ett museum hade 48 762 besökare ett år. Året efter hade det 52 349 besökare. Hur många fler kom det andra året? Avrunda också båda talen till närmaste tusental.</p>
      <textarea id="p1" placeholder="Visa beräkning och förklara..."></textarea></div>
      <div class="q"><strong>Problem 2</strong>
      <p>Skriv ett tal som har 7 tiotusental, 3 tusental, 5 hundratal, 0 tiotal och 8 ental. Skriv sedan talet i utvecklad form.</p>
      <textarea id="p2" placeholder="Visa ditt svar och förklara..."></textarea></div>
      <button class="btn" onclick="finishText('problem',['p1','p2'])">Lämna problemlösning</button>
      <div id="msg-problem" class="feedback"></div>`;
    return;
  }

  let generator,count;
  if(key==="position"){generator=questionPosition;count=12}
  if(key==="expanded"){generator=questionExpanded;count=12}
  if(key==="compare"){generator=questionCompare;count=12}
  if(key==="round"){generator=questionRound;count=12}
  if(key==="negative"){generator=questionNegative;count=12}
  if(key==="check"){generator=mixedQuestion;count=15}

  const qs=Array.from({length:count},()=>generator());
  current[key]=qs;

  el.innerHTML=`
    <div class="example">
      ${key==="position"?"Exempel: I 34 582 har siffran 4 värdet 4 000.":
        key==="expanded"?"Exempel: 6 432 = 6 000 + 400 + 30 + 2.":
        key==="compare"?"Jämför från vänster. Börja med den största platsen.":
        key==="round"?"Titta på siffran till höger om den plats du avrundar till.":
        key==="negative"?"På tallinjen är tal längre åt höger större.":
        "Kapitelkollen blandar alla delområden."}
    </div>
    ${qs.map((q,i)=>`
      <div class="q">
        <strong>${i+1}. ${q[0]}</strong>
        <div class="answer">
          <input id="${key}-${i}" autocomplete="off">
          <button class="btn secondary" onclick="checkOne('${key}',${i})">Kontrollera</button>
        </div>
        <div class="feedback" id="fb-${key}-${i}"></div>
      </div>`).join("")}
    <div class="footer-actions">
      <button class="btn" onclick="finishQuiz('${key}')">Rätta hela delen</button>
      <button class="btn secondary" onclick="openPart('${key}')">Ny omgång</button>
    </div>
    <div id="score-${key}" class="feedback"></div>`;
}

function checkOne(key,i){
  const q=current[key][i];
  const val=document.getElementById(`${key}-${i}`).value;
  const fb=document.getElementById(`fb-${key}-${i}`);
  const ok=norm(val)===norm(q[1]);
  fb.textContent=ok?"Rätt!":"Försök igen.";
  fb.className="feedback "+(ok?"ok":"no");
}

function finishQuiz(key){
  const qs=current[key];
  let right=0;
  qs.forEach((q,i)=>{
    const val=document.getElementById(`${key}-${i}`).value;
    if(norm(val)===norm(q[1]))right++;
  });
  const pct=Math.round(right/qs.length*100);
  state.scores[key]=pct;
  const msg=document.getElementById("score-"+key);

  if(pct>=80){
    state.done[key]=true;
    msg.textContent=`${right} av ${qs.length} rätt (${pct} %). Delen är klar!`;
    msg.className="feedback ok";
    localStorage.setItem(STORE,JSON.stringify(state));
    syncMainProgress();
    setTimeout(()=>render(),500);
  }else{
    msg.textContent=`${right} av ${qs.length} rätt (${pct} %). Du behöver minst 80 %. Träna vidare och försök igen.`;
    msg.className="feedback no";
    localStorage.setItem(STORE,JSON.stringify(state));
  }
}

function finishText(key,ids){
  const vals=ids.map(id=>document.getElementById(id).value.trim());
  const msg=document.getElementById("msg-"+key);
  if(vals.some(v=>v.length<30)){
    msg.textContent="Utveckla båda svaren lite mer så att ditt matematiska tänkande syns.";
    msg.className="feedback no";
    return;
  }
  state.done[key]=true;
  msg.textContent="Svaren är sparade. Delen är klar.";
  msg.className="feedback ok";
  save();
}

function resetChapter(){
  if(confirm("Vill du nollställa hela Kapitel 1?")){
    state={done:{},scores:{}};
    localStorage.removeItem(STORE);
    save();
  }
}

render();
syncMainProgress();
</script>
</body>
</html>
