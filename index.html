<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatteResan – åk 4–6</title>
<style>
:root{
  --bg:#f4efe4;--paper:#fffdf8;--green:#1f4b36;--green2:#e3ede5;--text:#173629;
  --muted:#6d786f;--line:#d8dfd7;--gold:#f2e6b9;--shadow:0 10px 28px rgba(38,55,43,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1200px;margin:auto;padding:24px}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0;font-size:clamp(38px,6vw,64px)}
.hero p{margin:8px 0 0;color:var(--muted);font-size:18px;max-width:720px;line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--green);color:white}
.btn.secondary{background:var(--green2);color:var(--green);border:1px solid var(--line)}
.notice{margin:18px 0;background:var(--gold);border:1px solid #dfcd8c;border-radius:16px;padding:14px 16px;color:#63531e}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-height:220px}
.card.locked{opacity:.58}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--green2);font-size:13px;font-weight:800}
.badge.lock{background:#ece9e3;color:#666}
.card h2{font-size:21px;margin:14px 0 6px}
.card p{margin:0;color:var(--muted);line-height:1.45}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.skills span{font-size:12px;background:#f7f3ea;border:1px solid var(--line);border-radius:999px;padding:5px 8px}
.card footer{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{display:none;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin:18px 0;box-shadow:var(--shadow)}
.panel.show{display:block}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.switch{width:48px;height:28px;border:0;border-radius:999px;background:#c9c8c1;padding:3px}
.switch:before{content:"";display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}.switch.on:before{transform:translateX(20px)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.modalbox{width:min(460px,100%);background:var(--paper);border-radius:22px;padding:22px}
.modalbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0 12px}
.small{font-size:13px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div>
      <h1>MatteResan</h1>
      <p>Träna matematik. Klara ett område. Gå vidare till nästa. Din lärare bestämmer vilka kapitel som är öppna.</p>
    </div>
    <div class="actions">
      <a class="btn" href="taluppfattning.html">Starta MatteResan</a>
      <button class="btn secondary" id="teacherBtn">Lärarläge</button>
    </div>
  </section>

  <div class="notice">
    Kapitel 1 är alltid öppet. Övriga kapitel öppnas av läraren.
  </div>

  <section class="panel" id="teacherPanel">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap">
      <div>
        <h2 style="margin:0 0 5px">Lärarläge</h2>
        <div class="small">Öppna de kapitel eleverna ska få arbeta med.</div>
      </div>
      <button class="btn secondary" id="closeTeacher">Stäng</button>
    </div>
    <div id="teacherRows"></div>
  </section>

  <section class="grid" id="chapterGrid"></section>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h3>Lärarläge</h3>
    <div class="small">PIN: 2468</div>
    <input id="pin" type="password" placeholder="Skriv PIN-kod">
    <div class="actions">
      <button class="btn" id="pinOk">Öppna</button>
      <button class="btn secondary" id="pinCancel">Avbryt</button>
    </div>
    <div id="msg" class="small" style="margin-top:10px"></div>
  </div>
</div>

<script>
const chapters=[
 {id:1,title:"Taluppfattning",file:"taluppfattning.html",desc:"Positionssystem, utvecklad form, jämföra tal, avrundning och negativa tal.",skills:["positionssystem","avrundning","negativa tal"]},
 {id:2,title:"Addition och subtraktion",file:"addition-subtraktion.html",desc:"Huvudräkning, skriftliga metoder, överslag och problemlösning.",skills:["huvudräkning","uppställning","rimlighet"]},
 {id:3,title:"Multiplikation",file:"multiplikation.html",desc:"Tabeller, strategier, större tal och problemlösning.",skills:["tabeller","strategier","textuppgifter"]},
 {id:4,title:"Division",file:"division.html",desc:"Delning, grupper, kort division och rest.",skills:["delning","kort division","rest"]},
 {id:5,title:"Bråk",file:"brak.html",desc:"Del av helhet, likvärdiga bråk, jämförelse och beräkningar.",skills:["täljare","nämnare","likvärdiga bråk"]},
 {id:6,title:"Decimaltal",file:"decimaltal.html",desc:"Tiondelar, hundradelar, jämförelse och beräkningar.",skills:["platsvärde","jämföra","beräkna"]},
 {id:7,title:"Procent",file:"procent.html",desc:"Hundradelar, procent av tal, rabatt och samband.",skills:["25 %","50 %","75 %"]},
 {id:8,title:"Algebra",file:"algebra.html",desc:"Mönster, variabler, uttryck och enkla ekvationer.",skills:["mönster","variabler","ekvationer"]},
 {id:9,title:"Geometri",file:"geometri.html",desc:"Vinklar, omkrets, area, symmetri och skala.",skills:["vinklar","area","omkrets"]},
 {id:10,title:"Mätning",file:"",desc:"Längd, massa, volym, tid och enhetsomvandling.",skills:["längd","massa","volym"]},
 {id:11,title:"Statistik och sannolikhet",file:"",desc:"Tabeller, diagram, medelvärde och sannolikhet.",skills:["diagram","medelvärde","sannolikhet"]},
 {id:12,title:"Problemlösning",file:"",desc:"Förstå problem, välja strategi och förklara lösningar.",skills:["strategier","rimlighet","resonemang"]}
];

const KEY="matterson-open-v2";
let openState={1:true};

try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
  openState={1:true,...saved};
}catch(e){
  openState={1:true};
}

function saveState(){
  localStorage.setItem(KEY,JSON.stringify(openState));
  render();
}

function render(){
  chapterGrid.innerHTML=chapters.map(c=>{
    const open=c.id===1 || !!openState[c.id];
    const built=!!c.file;
    const canOpen=open && built;

    return `<article class="card ${canOpen?"":"locked"}">
      <span class="badge ${canOpen?"":"lock"}">${canOpen?"● Öppet":"🔒 Låst"}</span>
      <h2>Kapitel ${c.id}: ${c.title}</h2>
      <p>${c.desc}</p>
      <div class="skills">${c.skills.map(s=>`<span>${s}</span>`).join("")}</div>
      <footer>
        <span class="small">${built?"":"Byggs snart"}</span>
        ${canOpen
          ? `<a class="btn" href="${c.file}">Starta</a>`
          : `<span class="btn secondary" style="cursor:default">Låst</span>`}
      </footer>
    </article>`;
  }).join("");

  teacherRows.innerHTML=chapters.map(c=>{
    const open=c.id===1 || !!openState[c.id];
    const built=!!c.file;
    return `<div class="trow">
      <div>
        <strong>Kapitel ${c.id}: ${c.title}</strong>
        <div class="small">${built?"Kapitelsidan finns":"Kapitelsidan byggs snart"}</div>
      </div>
      ${c.id===1
        ? `<span class="badge">Alltid öppet</span>`
        : `<button class="switch ${open?"on":""}" onclick="toggleChapter(${c.id})" aria-label="Öppna eller lås kapitel ${c.id}"></button>`}
      <span class="small">${open?"Öppet":"Låst"}</span>
    </div>`;
  }).join("");
}

function toggleChapter(id){
  if(id===1)return;
  openState[id]=!openState[id];
  saveState();
}

teacherBtn.onclick=()=>{
  modal.classList.add("show");
  pin.value="";
  msg.textContent="";
  setTimeout(()=>pin.focus(),50);
};

pinCancel.onclick=()=>modal.classList.remove("show");

pinOk.onclick=()=>{
  if(pin.value==="2468"){
    modal.classList.remove("show");
    teacherPanel.classList.add("show");
    teacherPanel.scrollIntoView({behavior:"smooth",block:"start"});
  }else{
    msg.textContent="Fel PIN-kod.";
  }
};

closeTeacher.onclick=()=>teacherPanel.classList.remove("show");

render();
</script>
</body>
</html>
